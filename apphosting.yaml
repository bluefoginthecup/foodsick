runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  - variable: NEXT_PUBLIC_AUTH_MODE
    value: firebase
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://apayo--foodsick-signal-map-kr.asia-east1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_USE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:126271004619:web:3bc3d47cfe8a67bff7a04e
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    value: 6LdVlIQtAAAAADQX6RA5fJ0la_qnNgsWXFFFSQrO
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CONTACT_FEEDBACK_BACKEND
    value: firebase
    availability:
      - BUILD
      - RUNTIME
  - variable: KAKAO_REST_API_KEY
    secret: KAKAO_REST_API_KEY
    availability:
      - RUNTIME
